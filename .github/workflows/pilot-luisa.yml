name: Validar origem Luisa na UmClique (amostra privada)
on:
  push:
    branches: [feat/origem-leads-luisa-mensageria]
    paths: [".github/workflows/pilot-luisa.yml", "ops/pilot-luisa.txt"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests google-auth
      - run: python -m unittest discover -s tests -p "test_*.py" -q
      - name: Ler até 50 conversas reais e atualizar Google Sheets restrito
        env:
          UMCLIQUE_API_KEY: ${{ secrets.UMCLIQUE_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: "1CPgLkw8jXIT_L9dATUU4gqsjl1vN3V0ANa7zfYQzs3k"
          MENSAJERIA_MAX_REFRESH: "50"
        run: python scripts/sync_mensageria.py
      - name: Validar somente dados agregados, sem informações pessoais
        run: |
          python - <<'PY'
          import json
          obj=json.load(open("data/mensageria.json"))
          camp=obj["campaign"]
          assert camp["marker"]=="Oi, equipe Luisa Pires"
          assert camp["coverage"]["scannedConversations"]<=camp["coverage"]["inScopeConversations"]
          assert isinstance(camp["rollups"],list) and len(camp["rollups"])>0
          assert isinstance(camp["daily"],list)
          text=json.dumps(obj,ensure_ascii=False).lower()
          for forbidden in ("conversation_id","contact_key","phone_number","wa_id","message_body"):
              assert forbidden not in text,forbidden
          x=next(r for r in camp["rollups"] if r["period"]=="all" and r["owner"]=="all" and r["channel"]=="all")
          print("Identificação por frase validada em dados reais.")
          print("Conversas lidas pelo classificador:",camp["coverage"]["scannedConversations"])
          print("Leads identificados na amostra:",x["identifiedLeads"])
          print("Mensagem privada e telefone nunca impressos nem publicados.")
          PY
