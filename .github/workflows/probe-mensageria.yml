name: Inspecionar campos de mensageria (sem dados pessoais)

on:
  push:
    branches: [feat/acompanhamento-mensageria]
    paths: ["ops/probe_mensageria.py", ".github/workflows/probe-mensageria.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests
      - name: Inspecionar apenas nomes de campos e tipos permitidos
        env:
          UMCLIQUE_API_KEY: ${{ secrets.UMCLIQUE_API_KEY }}
        run: python ops/probe_mensageria.py
