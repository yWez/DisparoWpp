name: Testes do sincronizador e dashboard

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "scripts/**"
      - "tests/**"
      - "assets/**"
      - "index.html"
      - "mensageria.html"
      - "data/**"
      - ".github/workflows/testes.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --disable-pip-version-check requests google-auth
      - name: Testes da API e privacidade
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Sintaxe dos scripts do painel
        run: |
          node --check assets/model.js
          node --check assets/dashboard-v2.js
          node --check assets/mensageria-model.js
          node --check assets/mensageria.js
      - name: Testes de filtros, taxas, fuso e CSV
        run: |
          node tests/test_dashboard.cjs
          node tests/test_mensageria.cjs
      - name: Integridade das fontes agregadas
        run: |
          python - <<'PY'
          import json, pathlib
          root = pathlib.Path(".")
          data = json.loads((root/"data/disparos.json").read_text())
          assert isinstance(data["campaigns"], list)
          ids = [c.get("campaignId") or c.get("id") for c in data["campaigns"]]
          assert len(ids) == len(set(ids)), "Campanha duplicada por ID"
          assert all("phone" not in str(k).lower() and "token" not in str(k).lower() for c in data["campaigns"] for k in c), "Dado privado em JSON"
          for path in ["data/origins.json", "data/funnel.json", "data/mensageria.json"]:
              json.loads((root/path).read_text())
          print("Contratos JSON e IDs: OK")
          PY
