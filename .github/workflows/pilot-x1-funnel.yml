name: Validar X1 com Google Sheets real (sem PII)
on:
  push:
    branches: [feat/x1-funil-rastreabilidade-2026]
    paths: [".github/workflows/pilot-x1-funnel.yml", "ops/pilot-x1-trigger.txt"]
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check requests google-auth
      - name: Consultar captação e aba restrita de grupo
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python scripts/sync_x1.py
          python - <<'PY'
          import json
          obj=json.load(open("data/x1-attribution.json",encoding="utf8"))
          assert obj["meta"]["schemaVersion"]==2, "O coletor X1 não consultou a fonte com sucesso"
          assert obj["registrations"]>=0
          assert obj["uniquePhones"]<=obj["registrations"]
          assert obj["unattributedRegistrations"]<=obj["registrations"]
          assert isinstance(obj["daily"],list)
          if obj["groupJoins"] is None:
              assert obj["groupJoinRate"] is None
          else:
              assert obj["groupJoins"]<=obj["uniquePhones"]
          print("X1 com origem real: cadastros únicos",obj["registrations"])
          print("Duplicatas removidas",obj["duplicatesRemoved"])
          print("Atribuídos a disparos",obj["registrations"]-obj["unattributedRegistrations"])
          print("Entradas no grupo comprovadas:",obj["groupJoins"] if obj["groupJoins"] is not None else "Não disponível")
          print("Fonte da última consulta:",obj["meta"]["lastCheckedAt"])
          print("Nenhum registro pessoal, telefone ou conteúdo de mensagem exibido")
          PY
