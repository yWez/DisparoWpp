name: Pilotar conciliação X1 com abas privadas (sem contatos)
on:
  push:
    branches: [feat/x1-grupos-importacao-lote-20261113]
    paths:
      - ".github/workflows/piloto-x1-roster.yml"
      - "ops/pilot-x1-verified-roster.txt"
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check requests google-auth
      - name: Consultar planilhas privadas sem publicar identificação
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python scripts/sync_x1.py
          python - <<'PY'
          import json
          d=json.load(open("data/x1-attribution.json",encoding="utf-8"))
          assert d["meta"]["schemaVersion"]==3, "Integração X1 não retornou esquema novo"
          assert d["groupRosterStatus"]=="unavailable", "Não existem listas verificadas ainda"
          assert d["groupMembers"] is None, "Sem lista não pode inferir membros"
          assert d["groupJoins"] is None, "Sem evento não pode inferir ingresso"
          assert d["registrations"]>=0
          assert d["groupRosterCounts"]==[]
          print("Captação X1 autenticada. Cadastros distintos:",d["registrations"])
          print("Importação de membros:",d["groupRosterStatus"])
          print("Ingressos confirmados:",d["groupJoins"])
          print("Somente agregados, sem dados de contatos no log")
          PY
