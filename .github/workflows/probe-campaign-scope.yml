name: Auditar abrangencia de campanhas (somente agregados)
on:
  push:
    branches: [fix/campanhas-refresh-provedores]
    paths: [".github/workflows/probe-campaign-scope.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests google-auth
      - name: Listar somente contagens e nomes de campanhas da conta autorizada
        env:
          UMCLIQUE_API_KEY: ${{ secrets.UMCLIQUE_API_KEY }}
        run: python ops/probe_campaign_scope.py
