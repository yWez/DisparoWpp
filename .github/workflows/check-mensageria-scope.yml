name: Verificar associação de canais da mensageria

on:
  push:
    branches: [feat/acompanhamento-mensageria]
    paths: ["ops/check_mensageria_scope.py", ".github/workflows/check-mensageria-scope.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests
      - name: Comparar canais e conversas, sem valores individuais
        env:
          UMCLIQUE_API_KEY: ${{ secrets.UMCLIQUE_API_KEY }}
        run: python ops/check_mensageria_scope.py
