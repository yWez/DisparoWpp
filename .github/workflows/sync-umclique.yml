name: Sincronizar disparos UmClique

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: umclique-sync
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ vars.UMCLIQUE_SYNC_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar bibliotecas
        run: python -m pip install --disable-pip-version-check requests google-auth
      - name: Executar testes antes da sincronização
        run: python -m unittest discover -s tests -v
      - name: Validar credenciais e escopo
        env:
          UMCLIQUE_API_KEY: ${{ secrets.UMCLIQUE_API_KEY }}
          UMCLIQUE_CHANNEL_ID: ${{ vars.UMCLIQUE_CHANNEL_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GH_PAGES_PUSH_TOKEN: ${{ secrets.GH_PAGES_PUSH_TOKEN }}
        shell: bash
        run: |
          for name in UMCLIQUE_API_KEY UMCLIQUE_CHANNEL_ID GOOGLE_SERVICE_ACCOUNT_JSON GH_PAGES_PUSH_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Falta configurar $name em Settings → Secrets and variables → Actions"
              exit 1
            fi
          done
      - name: Consultar UmClique e atualizar Google Sheets + JSON público
        env:
          UMCLIQUE_API_KEY: ${{ secrets.UMCLIQUE_API_KEY }}
          UMCLIQUE_CHANNEL_ID: ${{ vars.UMCLIQUE_CHANNEL_ID }}
          UMCLIQUE_CREATED_FROM: "2026-11-09T00:00:00-03:00"
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: "1CPgLkw8jXIT_L9dATUU4gqsjl1vN3V0ANa7zfYQzs3k"
        run: python scripts/sync_umclique.py
      - name: Publicar mudanças para GitHub Pages
        env:
          GH_PAGES_PUSH_TOKEN: ${{ secrets.GH_PAGES_PUSH_TOKEN }}
        shell: bash
        run: |
          if git diff --quiet -- data/disparos.json; then
            echo "Nenhuma mudança nos indicadores; publicação desnecessária."
            exit 0
          fi
          git config user.name "LP Crypto Automação"
          git config user.email "automation@users.noreply.github.com"
          git add data/disparos.json
          git commit -m "data: sincronizar campanhas da UmClique"
          git remote set-url origin "https://x-access-token:${GH_PAGES_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:main
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
