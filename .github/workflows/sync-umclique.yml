name: Sincronizar disparos UmClique

on:
  workflow_dispatch:
  # Permite teste operacional pelo conector: somente um arquivo marcador.
  # Atualizações dos arquivos JSON NÃO disparam este workflow.
  push:
    branches: [main]
    paths:
      - "ops/manual-sync-trigger.txt"
  # Fallback do fluxo completo. A cadência principal passa a ser o agendador
  # externo, que dispara campanhas a cada 5 min e mensageria/X1 a cada 15 min.
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: read

concurrency:
  group: umclique-sync
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.UMCLIQUE_SYNC_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar bibliotecas
        run: python -m pip install --disable-pip-version-check requests google-auth
      - name: Executar testes antes da sincronização
        run: python -m unittest discover -s tests -v
      - name: Validar credenciais e escopo
        env:
          UMCLIQUE_API_KEY: ${{ secrets.UMCLIQUE_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GH_PAGES_PUSH_TOKEN: ${{ secrets.GH_PAGES_PUSH_TOKEN }}
        shell: bash
        run: |
          for name in UMCLIQUE_API_KEY GOOGLE_SERVICE_ACCOUNT_JSON GH_PAGES_PUSH_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Falta configurar $name em Settings → Secrets and variables → Actions"
              exit 1
            fi
          done
      - name: Consultar UmClique e atualizar Google Sheets + JSON público
        env:
          UMCLIQUE_API_KEY: ${{ secrets.UMCLIQUE_API_KEY }}
          UMCLIQUE_CHANNEL_IDS: ${{ vars.UMCLIQUE_CHANNEL_IDS }}
          UMCLIQUE_CREATED_FROM: "2026-11-09T00:00:00-03:00"
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: "1CPgLkw8jXIT_L9dATUU4gqsjl1vN3V0ANa7zfYQzs3k"
        run: python scripts/sync_umclique.py
      - name: Conciliar cadastros X1 da planilha Captação
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          X1_CAPTACAO_SHEET_ID: "1AtxjojmOi3aAFk1gSc1O7Su4pQUSrgsndnNGZkkMU7U"
        run: python scripts/sync_x1.py
      - name: Sincronizar mensageria e carteiras dos responsáveis
        continue-on-error: true
        env:
          UMCLIQUE_API_KEY: ${{ secrets.UMCLIQUE_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: "1CPgLkw8jXIT_L9dATUU4gqsjl1vN3V0ANa7zfYQzs3k"
          MENSAJERIA_MAX_REFRESH: "120"
        run: python scripts/sync_mensageria.py
      - name: Publicar mudanças para GitHub Pages
        env:
          GH_PAGES_PUSH_TOKEN: ${{ secrets.GH_PAGES_PUSH_TOKEN }}
        shell: bash
        run: |
          if git diff --quiet -- data/disparos.json data/x1-attribution.json data/mensageria.json; then
            echo "Nenhuma mudança nos indicadores; publicação desnecessária."
            exit 0
          fi
          git config user.name "LP Crypto Automação"
          git config user.email "automation@users.noreply.github.com"
          git add data/disparos.json data/x1-attribution.json data/mensageria.json
          git commit -m "data: sincronizar campanhas da UmClique"
          git remote set-url origin "https://x-access-token:${GH_PAGES_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Commits humanos/deploys podem avançar main enquanto a API é consultada.
          # Rebase seguro dos JSONs agregados; nunca usar --force.
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Dados publicados sem sobrescrever commits concorrentes."
              git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
              exit 0
            fi
            echo "Main avançou durante a publicação. Reconciliando (tentativa ${attempt})."
            sleep 2
          done
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          echo "::error::Não foi possível publicar após três tentativas."
          exit 1
