name: Atualizar campanhas - consulta rápida

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ops/manual-campaign-refresh.txt"
  # Fallback. O agendamento primário de 5 min pode ser externo (Apps Script).
  schedule:
    - cron: "3-59/5 * * * *"

permissions:
  contents: read

concurrency:
  group: umclique-sync
  cancel-in-progress: false

jobs:
  broadcasts:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.UMCLIQUE_SYNC_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests google-auth
      - name: Validar credenciais
        env:
          UMCLIQUE_API_KEY: ${{ secrets.UMCLIQUE_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GH_PAGES_PUSH_TOKEN: ${{ secrets.GH_PAGES_PUSH_TOKEN }}
        shell: bash
        run: |
          for key in UMCLIQUE_API_KEY GOOGLE_SERVICE_ACCOUNT_JSON GH_PAGES_PUSH_TOKEN; do
            if [ -z "${!key}" ]; then
              echo "::error::Credencial ausente: ${key}"
              exit 1
            fi
          done
      - name: Consultar todas as campanhas da empresa e atualizar planilha
        env:
          UMCLIQUE_API_KEY: ${{ secrets.UMCLIQUE_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: "1CPgLkw8jXIT_L9dATUU4gqsjl1vN3V0ANa7zfYQzs3k"
          UMCLIQUE_CREATED_FROM: "2026-11-09T00:00:00-03:00"
          UMCLIQUE_FAST_MODE: "true"
        run: python scripts/sync_umclique.py
      - name: Publicar dashboard sem sobrescrever outros fluxos
        env:
          GH_PAGES_PUSH_TOKEN: ${{ secrets.GH_PAGES_PUSH_TOKEN }}
        shell: bash
        run: |
          if git diff --quiet -- data/disparos.json; then
            echo "API consultada; sem mudanças para publicação."
            exit 0
          fi
          git config user.name "LP Crypto Automação"
          git config user.email "automation@users.noreply.github.com"
          git add data/disparos.json
          git commit -m "data: atualizar campanhas de todos os canais da UmClique"
          git remote set-url origin "https://x-access-token:${GH_PAGES_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
              exit 0
            fi
            sleep 2
          done
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          echo "::error::Falha ao publicar campanhas; revisar concorrência"
          exit 1
