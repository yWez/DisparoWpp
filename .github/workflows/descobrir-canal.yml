name: Descobrir canal UmClique

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  descobrir:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar biblioteca de consulta
        run: python -m pip install --disable-pip-version-check requests
      - name: Validar os canais pelas sete campanhas históricas
        env:
          UMCLIQUE_API_KEY: ${{ secrets.UMCLIQUE_API_KEY }}
        shell: bash
        run: |
          if [ -z "$UMCLIQUE_API_KEY" ]; then
            echo "::error::Secret UMCLIQUE_API_KEY não configurado."
            exit 1
          fi
          python - <<'PY'
          import os, sys
          sys.path.insert(0,"scripts")
          from sync_umclique import api_session, discover_channel_ids

          api=api_session(os.environ["UMCLIQUE_API_KEY"])
          channels=discover_channel_ids(api,"2026-11-09T00:00:00-03:00")
          report=[
              "## Resultado da identificação dos canais",
              "",
              "✅ A API da UmClique respondeu e os sete disparos históricos foram reconhecidos.",
              "",
              f"**Canais Meta identificados:** {len(channels)}",
              "",
              "✅ O sincronizador já consegue identificar esses canais automaticamente,",
              "sem gravar variáveis no GitHub e sem copiar identificadores.",
              "",
              "🔒 Nenhuma chave API foi exibida ou publicada.",
              "",
              "**Próximo passo:** configurar o acesso à planilha Google e o token de publicação.",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
              f.write("\n".join(report)+"\n")
          print("Descoberta de canais concluída com sucesso. Veja o Summary.")
          PY
