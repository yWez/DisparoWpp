name: Validar coleta real de mensageria

on:
  push:
    branches: [feat/acompanhamento-mensageria]
    paths: ["ops/run-mensageria-check.txt", ".github/workflows/check-mensageria.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inbox:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests google-auth
      - name: Confirmar segurança e contratos
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Coletar um lote real sem publicar contatos no GitHub
        env:
          UMCLIQUE_API_KEY: ${{ secrets.UMCLIQUE_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: "1CPgLkw8jXIT_L9dATUU4gqsjl1vN3V0ANa7zfYQzs3k"
          MENSAJERIA_MAX_REFRESH: "80"
        run: python scripts/sync_mensageria.py
      - name: Validar dados agregados e privacidade
        run: |
          python - <<'PY'
          import json
          p=json.load(open("data/mensageria.json"))
          assert p["meta"]["scannedConversations"]>=0
          assert len(p["owners"])>=1
          assert len(p["channels"])>=1
          assert len(p["rollups"])>0
          assert "messages" not in p and "contacts" not in p
          print("Dados agregados válidos. Nomes/telefones de leads não foram publicados.")
          PY
